<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:cc="http://xmlns.jcp.org/jsf/composite"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html">
    <cc:interface>
        <cc:attribute name="bean" required="true" />
        <cc:attribute name="updateNuevo" default=":frmPrincipal:dlg" />
        <cc:attribute name="updateVolver" default=":frmPrincipal, :frmPrincipal:toolbar" />
        <cc:attribute name="renderNuevo" default="#{!cc.attrs.bean.pnlDetalle}" />
        <cc:attribute name="renderVolver" default="#{cc.attrs.bean.pnlDetalle}" />
        <cc:attribute name="styleClassNuevo" default="p-button p-button-nuevo" />
        <cc:attribute name="styleClassVolver" default="p-button p-button-volver" />

        <cc:attribute name="param" required="false" />
    </cc:interface>
    <cc:implementation>
        <h:panelGroup rendered="#{cc.attrs.renderNuevo}">
            <h:panelGroup rendered="#{!cc.attrs.bean.pnlDetalle}">
                <p:commandButton value="Nuevo" icon="pi pi-plus"
                                 action="#{cc.attrs.bean.btnNuevoHandler(param)}"
                                 update=":frmPrincipal:dlg"
                                 process="@this"
                                 immediate="true"
                                 styleClass="p-button p-button-nuevo"/>
            </h:panelGroup>

            <!--
            <p:commandButton value="Nuevo" icon="pi pi-plus"
                             action="#{cc.attrs.bean.btnNuevoHandler(cc.attrs.param)}"
                             update="#{cc.attrs.updateNuevo}"
                             process="@this"
                             immediate="true"
                             styleClass="p-button p-button-nuevo"/>
                             -->
        </h:panelGroup>
        <!--
        <h:panelGroup rendered="#{cc.attrs.renderVolver}">
            <p:commandButton id="btnVOLVER" value="VOLVER" icon="pi pi-arrow-left"
                             action="#{cc.attrs.bean.volver()}"
                             update="#{cc.attrs.updateVolver}"
                             styleClass="#{cc.attrs.styleClassVolver}" />
        </h:panelGroup>
        -->
        <!-- BOTÓN VOLVER -->
        <h:panelGroup rendered="#{cc.attrs.bean.pnlDetalle}">
            <p:commandButton value="VOLVER" icon="pi pi-arrow-left"
                             action="#{cc.attrs.bean.volver()}"
                             update=":frmPrincipal, :frmPrincipal:toolbar"
                             styleClass="p-button p-button-volver"/>
        </h:panelGroup>
    </cc:implementation>

</ui:composition>
