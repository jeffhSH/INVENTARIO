   <!DOCTYPE html>
   <html xmlns="http://www.w3.org/1999/xhtml"
         xmlns:h="http://xmlns.jcp.org/jsf/html"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:p="http://primefaces.org/ui"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

   <ui:composition template="template.xhtml">

      <ui:define name="content">
         <h:form id="frmPrincipal" update=":frmPrincipal:toolbar">

            <p:growl id="growl" showDetail="true" life="3000" />

            <!-- Toolbar superior -->
            <p:toolbar id="toolbar" class="toolbar-gap">
               <p:toolbarGroup class="toolbar-center">
                  <span class="toolbar-title">#{tipoUnidadMedidaFrm.nombreBean}</span>
               </p:toolbarGroup>

               <p:toolbarGroup class="toolbar-group-right">

                  <p:commandButton value="Nuevo" icon="pi pi-plus"
                                   action="#{tipoUnidadMedidaFrm.btnNuevoHandler(a)}"
                                   update=":frmPrincipal:dlg"
                                   styleClass="p-button p-button-nuevo"
                                   rendered="#{!tipoUnidadMedidaFrm.pnlDetalle}"
                                   process="@this" immediate="true"/>

                  <p:commandButton id="btnVOLVER" icon="pi pi-arrow-left"  value="VOLVER"
                                   rendered="#{tipoUnidadMedidaFrm.pnlDetalle}"
                                   styleClass="p-button p-button-volver"
                                   action="#{tipoUnidadMedidaFrm.volver()}"
                                   update=":frmPrincipal, :frmPrincipal:toolbar" />
               </p:toolbarGroup>
               <p:toolbarGroup>

                  <!-- Botón Modificar -->



               </p:toolbarGroup>
            </p:toolbar>

            <!-- Tabla de Tipos de Unidad de Medida -->
            <p:dataTable id="tbl"
                         value="#{tipoUnidadMedidaFrm.model}" var="r"
                         lazy="true" paginator="true" rows="10"
                         rowsPerPageTemplate="10,20,50"
                         currentPageReportTemplate="Mostrando {startRecord}-{endRecord} de {totalRecords}"
                         paginatorPosition="bottom"
                         responsiveLayout="scroll"
                         rowHover="true"
                         rendered="#{!tipoUnidadMedidaFrm.pnlDetalle}"
                         emptyMessage="No hay registros"
                         styleClass="table-modern"
                         selectionMode="single"
                         selection="#{tipoUnidadMedidaFrm.registro}" rowKey="#{r.id}" >

               <p:ajax event="rowSelect"
                       listener="#{tipoUnidadMedidaFrm.selectionHandler}"
                       update="frmPrincipal"/>

               <p:ajax event="rowUnselect"
                       listener="#{tipoUnidadMedidaFrm.rowUnselectHandler}"
                       update=":frmPrincipal:tbl :frmPrincipal:growl :frmPrincipal:toolbar"  />

               <p:column headerText="ID" style="width:90px" sortBy="#{r.id}">
                  <h:outputText value="#{r.id}" />
               </p:column>

               <p:column headerText="Nombre" sortBy="#{r.nombre}" filterBy="#{r.nombre}" filterMatchMode="contains">
                  <h:outputText value="#{r.nombre}" />
               </p:column>

               <p:column headerText="Unidad Base" sortBy="#{r.unidadBase}" filterBy="#{r.unidadBase}" filterMatchMode="contains">
                  <h:outputText value="#{r.unidadBase}" />
               </p:column>

               <p:column headerText="Estado" style="width:100px">
                  <h:outputText value="#{r.activo ? 'Activo' : 'Inactivo'}" />
               </p:column>
            </p:dataTable>

            <!-- Panel de Detalle -->
            <h:panelGroup id="pnlDetalle" class="" rendered="#{tipoUnidadMedidaFrm.pnlDetalle}">

               <p:tabView id="tabViewProducto" rendered="#{tipoUnidadMedidaFrm.pnlDetalle}" cache="false" dynamic="true">
               <p:tab title="Generalidades" closable="false">
               <p:commandButton id="btnModificar" value="Modificar"
                                icon="pi pi-pencil"
                                action="#{tipoUnidadMedidaFrm.btnEditarHandler(tipoUnidadMedidaFrm.registro)}"
                                rendered="#{tipoUnidadMedidaFrm.pnlDetalle}"
                                update=":frmPrincipal"
                                oncomplete="PF('dlgVar').show()"
                                styleClass="p-button p-button-modificar" />
                  <p:commandButton icon="pi pi-trash" value="Eliminar"
                                   rendered="#{tipoUnidadMedidaFrm.pnlDetalle}"
                                   oncomplete="PF('confirmDel').show()"
                                   process="@this"
                                   styleClass="p-button p-button-eliminar"/>


               <h:panelGrid columns="2" class="form-item">

                  <p><strong>ID:</strong> #{tipoUnidadMedidaFrm.registro.id}</p>
                  <p><strong>Nombre:</strong> #{tipoUnidadMedidaFrm.registro.nombre}</p>
               </h:panelGrid>

               <h:panelGrid columns="2" class="form-item">
                  <p><strong>Unidad Base:</strong> #{tipoUnidadMedidaFrm.registro.unidadBase}</p>
                  <p><strong>Estado:</strong> #{tipoUnidadMedidaFrm.registro.activo ? 'Activo' : 'Inactivo'}</p>
               </h:panelGrid>

               <h:panelGrid columns="1" class="form-item">
                  <p><strong>Comentarios:</strong></p>
                  <p:inputTextarea value="#{tipoUnidadMedidaFrm.registro.comentarios}"
                                   rows="3" cols="50" disabled="true" />
               </h:panelGrid>
               </p:tab>


               <p:tab title="Unidades de Medidas" closable="false">

                  <p:dataTable id="tblUnidadMedidas"
                               value="#{unidadMedidaFrm.getListaUnidadMedida(tipoUnidadMedidaFrm.registro.id)}"  var="relacion"
                               lazy="true" paginator="true" rows="5"
                               rowsPerPageTemplate="5,10,20"
                               currentPageReportTemplate="Mostrando {startRecord}-{endRecord} de {totalRecords}"
                               paginatorPosition="bottom"
                               emptyMessage="No hay relaciones producto-tipo registradas"
                               styleClass="table-modern"
                               selectionMode="single"
                               selection="#{unidadMedidaFrm.registro}"
                               rowKey="#{relacion.id}">

                     <p:ajax event="rowSelect"
                             listener="#{unidadMedidaFrm.selectionHandler}"
                             update="frmPrincipal" />

                     <p:column headerText="ID" style="width: 80px;" sortBy="#{relacion.id}">
                        <h:outputText value="#{relacion.id}" />
                     </p:column>

                     <p:column headerText="Equivalencia" style="width: 80px;" sortBy="#{relacion.id}">
                        <h:outputText value="#{relacion.equivalencia}" />
                     </p:column>

                     <p:column headerText="Activo" style="width: 80px;" sortBy="#{relacion.id}">
                        <h:outputText value="#{relacion.activo? 'activo': 'inactivo'}" />
                     </p:column>

                     <p:column headerText="Expresion Regular" style="width: 80px;" sortBy="#{relacion.expresionRegular}">
                        <h:outputText value="#{relacion.equivalencia}" />
                     </p:column>

                     <p:column headerText="Comentarios" style="width: 80px;" sortBy="#{relacion.comentarios}">
                        <h:outputText value="#{relacion.comentarios}" />
                     </p:column>

                  </p:dataTable>
                  <p:commandButton value="Nueva Unidad de Medida" icon="pi pi-plus"
                                   actionListener="#{unidadMedidaFrm.btnNuevoHandler(z)}"
                                   process="@this"
                                   update=":frmPrincipal:pnlDetalle"

                                   styleClass="p-button p-button-nuevo"/>
               <!-- dialog de crear Unidad de medida-->
                  <p:dialog id="dlgU" header="Nueva Unidad de Unidad de Medida"
                            widgetVar="dlgU" modal="true" resizable="false" closable="true" width="520"
                            visible="#{unidadMedidaFrm.mostrarFormulario}"
                            styleClass="ui-dialog">

                     <h:panelGrid columns="1" columnClasses="w-full" styleClass="gap-2 w-full">
                        <p:messages />

                        <h:panelGrid columns="2" styleClass="align-items-center">
                           <p:outputLabel value="ID Tipo Unidad de Medida:" />
                           <h:outputText value="#{tipoUnidadMedidaFrm.registro.id}" />
                        </h:panelGrid>


                        <h:panelGrid columns="2" styleClass="align-items-center">
                           <h:selectBooleanCheckbox id="chkActivo1" value="#{unidadMedidaFrm.registro.activo}"/>
                           <h:outputLabel for="chkActivo1" value="¿Activo?" />
                        </h:panelGrid>

                        <h:panelGrid columns="2" styleClass="align-items-center">
                           <p:inputText value="#{unidadMedidaFrm.registro.equivalencia}" placeholder="Equivalencias"
                                        />
                        </h:panelGrid>

                        <h:panelGrid columns="2" styleClass="align-items-center">
                           <p:inputText value="#{unidadMedidaFrm.registro.expresionRegular}" placeholder="Expresion Regular"
                                        />
                        </h:panelGrid>

                        <h:panelGrid columns="2" styleClass="align-items-center">
                           <p:inputText value="#{unidadMedidaFrm.registro.comentarios}" placeholder="Comentarios"
                           />
                        </h:panelGrid>

                        <div class="flex justify-end gap-2 mt-3">
                           <p:commandButton value="Cancelar" icon="pi pi-times"
                                            actionListener="#{unidadMedidaFrm.btnCancelarHandler}"
                                            process="@this"
                                            update=":frmPrincipal"
                                            styleClass="p-button-text"/>
                           <p:commandButton value="Crear Unidad de Medida"
                                            icon="pi pi-check"
                                            action="#{unidadMedidaFrm.btnGuardarHandler(x)}"
                                            process=":frmPrincipal:pnlDetalle"
                                            update=":frmPrincipal:growl"
                                            oncomplete=" PF('dlgVar1').hide();"/>
                        </div>
                     </h:panelGrid>
                  </p:dialog>

                    </p:tab>
               </p:tabView>
            </h:panelGroup>

            <!-- Diálogo Crear/Editar -->
            <p:dialog id="dlg" header="#{tipoUnidadMedidaFrm.editionMode ? 'Editar' : 'Nuevo'} Tipo de Unidad de Medida"
                      widgetVar="dlgVar" modal="true" resizable="true" closable="true" width="520"
                      visible="#{tipoUnidadMedidaFrm.mostrarFormulario and !tipoUnidadMedidaFrm.pnlDetalle}"
                      styleClass="ui-dialog">

               <h:panelGrid columns="1" style="width: 90%;" styleClass="gap-2 w-full">
                  <p:messages />


                  <p:inputText value="#{tipoUnidadMedidaFrm.registro.nombre}" placeholder="Nombre" required="true"
                               requiredMessage="El nombre es obligatorio"/>

                  <p:inputText value="#{tipoUnidadMedidaFrm.registro.unidadBase}" placeholder="Unidad Base (ej: gramos, litros, metros)"
                               maxlength="155"/>

                  <p:inputTextarea value="#{tipoUnidadMedidaFrm.registro.comentarios}" rows="3" autoResize="true"
                                   placeholder="Comentarios adicionales (opcional)"/>

                  <h:panelGrid columns="2" styleClass="align-items-center">
                     <h:selectBooleanCheckbox id="chkActivo" value="#{tipoUnidadMedidaFrm.registro.activo}"/>
                     <h:outputLabel for="chkActivo" value="¿Activo?" />
                  </h:panelGrid>

                  <div class="flex justify-end gap-2 mt-3">
                     <p:commandButton value="Cancelar" icon="pi pi-times"
                                      actionListener="#{tipoUnidadMedidaFrm.btnCancelarHandler}"
                                      process="@this"
                                      update=":frmPrincipal:dlg"
                                      styleClass="p-button-text"/>
                     <p:commandButton value="#{tipoUnidadMedidaFrm.editionMode ? 'Guardar cambios' : 'Crear'}"
                                      icon="pi pi-check"
                                      action="#{tipoUnidadMedidaFrm.btnGuardarHandler}"
                                      process=":frmPrincipal:dlg"
                                      update=":frmPrincipal"
                                      oncomplete="if (!args.validationFailed) PF('dlgVar1').hide();"/>
                  </div>
               </h:panelGrid>
            </p:dialog>

            <!-- Confirmación elegante de borrado -->
            <p:confirmDialog widgetVar="confirmDel" header="Confirmar eliminación" message="¿Eliminar este registro?"
                             icon="pi pi-exclamation-triangle" closable="false"
                             styleClass="ui-dialog">
               <div class="flex justify-end gap-2">
                  <p:commandButton value="Cancelar" type="button" styleClass="p-button-text"
                                   onclick="PF('confirmDel').hide()"/>
                  <p:commandButton value="Sí, eliminar" icon="pi pi-trash"
                                   actionListener="#{tipoUnidadMedidaFrm.btnEliminarHandler(tipoUnidadMedidaFrm.registro)}"
                                   update="frmPrincipal"
                                   oncomplete="PF('confirmDel').hide();"/>
               </div>
            </p:confirmDialog>

         </h:form>
      </ui:define>
   </ui:composition>
   </html>
