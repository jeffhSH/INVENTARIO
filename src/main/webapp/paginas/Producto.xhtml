<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="template.xhtml">

    <ui:define name="content">
        <h:form id="frmPrincipal" update=":frmPrincipal:toolbar">


            <p:growl id="growl" showDetail="true" life="3000"/>
            <!-- Toolbar superior -->

            <p:toolbar id="toolbar" class="toolbar-gap">
                <p:toolbarGroup class="toolbar-center">
                    <span class="toolbar-title">#{productoFrm.nombreBean}</span>
                </p:toolbarGroup>

                <p:toolbarGroup class="toolbar-group-right">
                    <p:inputText placeholder="Buscar por nombre…" value="#{productoFrm.registro.nombreProducto}"/>
                    <ui:include src="componentes/botones-top.xhtml">
                        <ui:param name="section" value="nuevo"/>
                        <ui:param name="bean" value="#{productoFrm}"/>
                    </ui:include>
                    <ui:include src="componentes/botones-top.xhtml">
                        <ui:param name="section" value="volver"/>
                        <ui:param name="bean" value="#{productoFrm}"/>
                    </ui:include>
                </p:toolbarGroup>
                <p:toolbarGroup>

                    <!-- Botón Modificar -->
                    <ui:include src="componentes/botones-top.xhtml">
                        <ui:param name="section" value="modificar"/>
                        <ui:param name="bean" value="#{productoFrm}"/>
                    </ui:include>

                    <ui:include src="componentes/botones-top.xhtml">
                        <ui:param name="section" value="eliminar"/>
                        <ui:param name="bean" value="#{productoFrm}"/>
                    </ui:include>
                </p:toolbarGroup>
            </p:toolbar>

            <div class="content">

                <p:dataTable id="tbl"
                             value="#{productoFrm.model}" var="r"
                             lazy="true" paginator="true" rows="10"
                             rowsPerPageTemplate="10,20,50"
                             currentPageReportTemplate="Mostrando {startRecord}-{endRecord} de {totalRecords}"
                             paginatorPosition="bottom"
                             responsiveLayout="scroll"
                             rowHover="true"
                             rendered="#{!productoFrm.pnlDetalle}"
                             emptyMessage="No hay registros"
                             styleClass="table-modern"
                             selectionMode="single"
                             selection="#{productoFrm.registro}" rowKey="#{r.id}">
                    <p:ajax event="rowSelect"
                            listener="#{productoFrm.selectionHandler}"
                            update="frmPrincipal"

                    />

                    <p:ajax event="rowUnselect"
                            listener="#{productoFrm.rowUnselectHandler}"
                            update=":frmPrincipal:tbl :frmPrincipal:growl :frmPrincipal:toolbar :frmPrincipal:tabViewProducto"/>

                    <p:column headerText="ID" style="width:320px" sortBy="#{r.id}">
                        <h:outputText value="#{r.id}"/>
                    </p:column>

                    <p:column headerText="Nombre" sortBy="#{r.nombreProducto}" filterBy="#{r.nombreProducto}"
                              filterMatchMode="contains">
                        <h:outputText value="#{r.nombreProducto}"/>
                    </p:column>

                    <p:column headerText="Referencia Externa" sortBy="#{r.referenciaExterna}"
                              filterBy="#{r.referenciaExterna}" filterMatchMode="contains">
                        <h:outputText value="#{r.referenciaExterna}"/>
                    </p:column>

                    <p:column headerText="Estado" style="width:100px">
                        <h:outputText value="#{r.activo ? 'Activo' : 'Inactivo'}"/>
                    </p:column>

                </p:dataTable>

                <p:tabView id="tabViewProducto" rendered="#{productoFrm.pnlDetalle}" cache="false" dynamic="true">

                    <!-- Pestaña 1: Información General -->
                    <p:tab title="Información General">

                        <h:panelGrid columns="2" class="form-item">
                            <p><strong>ID:</strong> #{productoFrm.registro.id}</p>
                            <p><strong>Nombre:</strong> #{productoFrm.registro.nombreProducto}</p>
                        </h:panelGrid>

                        <h:panelGrid columns="2" class="form-item">
                            <p><strong>Referencia Externa:</strong></p>
                            <p:inputTextarea value="#{productoFrm.registro.referenciaExterna}" rows="2" cols="30"
                                             disabled="true"/>
                        </h:panelGrid>

                        <h:panelGrid columns="2" class="form-item">
                            <p><strong>Comentarios:</strong></p>
                            <p:inputTextarea value="#{productoFrm.registro.comentarios}" rows="3" cols="30"
                                             disabled="true"/>
                        </h:panelGrid>

                        <p><strong>Estado:</strong> #{productoFrm.registro.activo ? 'Activo' : 'Inactivo'}</p>
                    </p:tab>

                    <!-- Pestaña 2: Tipos de Producto -->
                    <p:tab title="Tipos de Producto" closable="false">

                        <h:panelGroup id="pnlTipos">
                            <h:panelGrid>

                                <p:dataTable id="tblTipos"
                                             value="#{productoTipoProductoFrm.findByIdP(productoFrm.registro.id)}"
                                             var="relacion"
                                             lazy="true" paginator="true" rows="5"
                                             rowsPerPageTemplate="5,10,20"
                                             currentPageReportTemplate="Mostrando {startRecord}-{endRecord} de {totalRecords}"
                                             paginatorPosition="bottom"
                                             emptyMessage="No hay relaciones producto-tipo registradas"
                                             styleClass="table-modern"
                                             selectionMode="single"
                                             selection="#{productoTipoProductoFrm.registro}"
                                             rowKey="#{relacion.id}">

                                    <p:ajax event="rowSelect"
                                            listener="#{productoTipoProductoFrm.selectionHandler}"
                                            update="frmPrincipal"/>

                                    <p:column headerText="ID" style="width: 80px;" sortBy="#{relacion.id}">
                                        <h:outputText value="#{relacion.id}"/>
                                    </p:column>

                                    <p:column headerText="Producto">
                                        <h:outputText value="#{productoTipoProductoFrm.getNombreProducto(relacion)}"/>
                                    </p:column>

                                    <p:column headerText="Tipo Producto">
                                        <h:outputText
                                                value="#{productoTipoProductoFrm.getNombreTipoProducto(relacion)}"/>
                                    </p:column>

                                    <p:column headerText="Fecha Creación" sortBy="#{relacion.fechaCreacion}">
                                        <h:outputText value="#{relacion.fechaCreacion}">
                                            <f:converter converterId="offsetDateTimeConverter"/>
                                        </h:outputText>
                                    </p:column>

                                    <p:column headerText="Estado" style="width: 100px;">
                                        <h:outputText value="#{relacion.activo ? 'Activo' : 'Inactivo'}"/>
                                    </p:column>

                                    <p:column headerText="Observaciones" sortBy="#{relacion.observaciones}">
                                        <h:outputText value="#{relacion.observaciones}"/>
                                    </p:column>

                                </p:dataTable>

                            </h:panelGrid>
                        </h:panelGroup>

                    </p:tab>
                </p:tabView>


                <!-- Diálogo Crear/Editar -->
                <p:dialog id="dlg" header="#{productoFrm.editionMode ? 'Editar' : 'Nuevo'} Producto"
                          widgetVar="dlgVar" modal="true" resizable="true" closable="true" width="520"
                          visible="#{productoFrm.mostrarFormulario}"
                          styleClass="ui-dialog">

                    <h:panelGrid columns="1" columnClasses="w-full" styleClass="gap-2 w-full">
                        <p:messages/>

                        <p:inputText value="#{productoFrm.registro.nombreProducto}" placeholder="Nombre del Producto"
                                     required="true"
                                     requiredMessage="El nombre del producto es obligatorio"/>

                        <p:inputTextarea value="#{productoFrm.registro.referenciaExterna}" rows="2" autoResize="true"
                                         placeholder="Referencia Externa (opcional)"/>

                        <p:inputTextarea value="#{productoFrm.registro.comentarios}" rows="3" autoResize="true"
                                         placeholder="Comentarios (opcional)"/>

                        <h:selectBooleanCheckbox id="chkActivo" value="#{productoFrm.registro.activo}"/>
                        <h:outputLabel for="chkActivo" value="¿Activo?"/>

                        <div class="flex justify-end gap-2 mt-3">
                            <ui:include src="componentes/botones-top.xhtml">
                                <ui:param name="section" value="cancelar"/>
                                <ui:param name="bean" value="#{productoFrm}"/>
                            </ui:include>
                            <ui:include src="componentes/botones-top.xhtml">
                                <ui:param name="section" value="guardar"/>
                                <ui:param name="bean" value="#{productoFrm}"/>
                            </ui:include>
                        </div>
                    </h:panelGrid>
                </p:dialog>

                <!-- Confirmación elegante de borrado -->
                <p:confirmDialog widgetVar="confirmDel" header="Confirmar eliminación"
                                 message="¿Eliminar este registro?"
                                 icon="pi pi-exclamation-triangle" closable="false"
                                 styleClass="ui-dialog">
                    <div class="flex justify-end gap-2">
                        <ui:include src="componentes/botones-top.xhtml">
                            <ui:param name="section" value="cancelarBorrado"/>
                            <ui:param name="bean" value="#{productoFrm}"/>
                        </ui:include>
                        <ui:include src="componentes/botones-top.xhtml">
                            <ui:param name="section" value="eliminarDefinitivo"/>
                            <ui:param name="bean" value="#{productoFrm}"/>
                        </ui:include>
                    </div>
                </p:confirmDialog>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
</html>
