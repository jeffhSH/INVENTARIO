<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:cbtn="http://xmlns.jcp.org/jsf/composite/componentes">
>

<ui:composition template="template.xhtml">

    <ui:define name="content">
        <h:form id="frmPrincipal" update=":frmPrincipal:toolbar">


            <p:growl id="growl" showDetail="true" life="3000" />
            <!-- Toolbar superior -->

            <p:toolbar id="toolbar" class="toolbar-gap">
                <p:toolbarGroup class="toolbar-center">
                    <span class="toolbar-title">#{tipoAlmacenFrm.nombreBean}</span>
                </p:toolbarGroup>

                <p:toolbarGroup class="toolbar-group-right">
                    <p:inputText placeholder="Buscar por nombre…" value="#{tipoAlmacenFrm.registro.nombre}" />
                    <cbtn:botones-top bean="#{tipoAlmacenFrm}"
                                      updateNuevo=":frmPrincipal:dlg"
                                      updateVolver=":frmPrincipal, :frmPrincipal:toolbar"/>
                    <!--
                    <p:commandButton value="Nuevo" icon="pi pi-plus"
                                     action="#{tipoAlmacenFrm.btnNuevoHandler(r)}"
                                     update=":frmPrincipal:dlg"
                                     styleClass="p-button p-button-nuevo"
                                     rendered="#{!tipoAlmacenFrm.pnlDetalle}"
                                     process="@this" immediate="true"/>

                    <p:commandButton id="btnVOLVER" icon="pi pi-arrow-left"  value="VOLVER"
                                     rendered="#{tipoAlmacenFrm.pnlDetalle}"
                                     styleClass="p-button p-button-volver"
                                     action="#{tipoAlmacenFrm.volver()}"
                                     update=":frmPrincipal, :frmPrincipal:toolbar"/>
                                     -->
                </p:toolbarGroup>
                <p:toolbarGroup>

                    <!-- Botón Modificar -->
                    <p:commandButton id="btnModificar" value="Modificar"
                                     icon="pi pi-pencil"
                                     action="#{tipoAlmacenFrm.btnEditarHandler(tipoAlmacenFrm.registro)}"
                                     rendered="#{tipoAlmacenFrm.pnlDetalle}"
                                     update=":frmPrincipal"
                                     oncomplete="PF('dlgVar').show()"
                                     styleClass="p-button p-button-modificar" />

                    <p:commandButton icon="pi pi-trash" value="Eliminar"
                                     rendered="#{tipoAlmacenFrm.pnlDetalle}"
                                     oncomplete="PF('confirmDel').show()"
                                     process="@this"
                                     styleClass="p-button p-button-eliminar"
                    >

                    </p:commandButton>
                </p:toolbarGroup>
            </p:toolbar>


            <p:dataTable id="tbl"
                         value="#{tipoAlmacenFrm.model}" var="r"
                         lazy="true" paginator="true" rows="10"
                         rowsPerPageTemplate="10,20,50"
                         currentPageReportTemplate="Mostrando {startRecord}-{endRecord} de {totalRecords}"
                         paginatorPosition="bottom"
                         responsiveLayout="scroll"
                         rowHover="true"
                         rendered="#{!tipoAlmacenFrm.pnlDetalle}"
                         emptyMessage="No hay registros"
                         styleClass="table-modern"
                         selectionMode="single"
                         selection="#{tipoAlmacenFrm.registro}" rowKey="#{r.id}" >
                <p:ajax event="rowSelect"
                        listener="#{tipoAlmacenFrm.selectionHandler}"
                        update="frmPrincipal"

                />

                <p:ajax event="rowUnselect"
                        listener="#{tipoAlmacenFrm.rowUnselectHandler}"
                        update=":frmPrincipal:tbl :frmPrincipal:growl :frmPrincipal:toolbar"  />

                <p:column headerText="ID" style="width:90px" sortBy="#{r.id}">
                    <h:outputText value="#{r.id}" />
                </p:column>

                <p:column headerText="Nombre" sortBy="#{r.nombre}" filterBy="#{r.nombre}" filterMatchMode="contains">
                    <h:outputText value="#{r.nombre}" />
                </p:column>


                <!-- panel detalle -->
            </p:dataTable>
            <h:panelGroup>

            </h:panelGroup>
            <h:panelGroup id="pnlDetalle" class="detalle-panel" rendered="#{tipoAlmacenFrm.pnlDetalle}">
                <!-- Título del panel -->
                <h:outputText value="Detalle del Almacén" class="detalle-titulo"/>

                <h:panelGrid columns="2" class="form-item">
                    <p><strong>ID:</strong> #{tipoAlmacenFrm.registro.id}</p>
                    <p><strong>Nombre:</strong> #{tipoAlmacenFrm.registro.nombre}</p>
                </h:panelGrid>

                <h:panelGrid columns="2" class="form-item">
                    <p><strong>Observaciones:</strong></p>
                    <p:inputTextarea value="#{tipoAlmacenFrm.registro.observaciones}" rows="3" cols="30" disabled="true" />
                </h:panelGrid>

                <p><strong>Estado:</strong> #{tipoAlmacenFrm.registro.activo ? 'Activo' : 'Inactivo'}</p>
            </h:panelGroup>


            <!-- Diálogo Crear/Editar -->
            <p:dialog id="dlg" header="#{tipoAlmacenFrm.editionMode ? 'Editar' : 'Nuevo'} Tipo de Almacén"
                      widgetVar="dlgVar" modal="true" resizable="true" closable="true" width="520"
                      visible="#{tipoAlmacenFrm.mostrarFormulario}"
                      styleClass="ui-dialog">

                <h:panelGrid columns="1" columnClasses="w-full" styleClass="gap-2 w-full">
                    <p:messages />
                    <h:panelGroup rendered="#{!tipoAlmacenFrm.editionMode}">
                        <small class="text-500">Siguiente ID: #{tipoAlmacenFrm.proximoId}</small>
                    </h:panelGroup>

                    <p:inputText value="#{tipoAlmacenFrm.registro.nombre}" placeholder="Nombre" required="true"
                                 requiredMessage="El nombre es obligatorio"/>

                    <p:inputTextarea value="#{tipoAlmacenFrm.registro.observaciones}" rows="3" autoResize="true"
                                     placeholder="Observaciones (opcional)"/>

                    <h:selectBooleanCheckbox id="chkActivo" value="#{tipoAlmacenFrm.registro.activo}"/>
                    <h:outputLabel for="chkActivo" value="¿Activo?" />

                    <div class="flex justify-end gap-2 mt-3">
                        <p:commandButton value="Cancelar" icon="pi pi-times"
                                         actionListener="#{tipoAlmacenFrm.btnCancelarHandler}"
                                         process="@this"
                                         update=":frmPrincipal:panelCompleto,:frmPrincipal:dlg"
                                         styleClass="p-button-text"/>
                        <p:commandButton value="#{tipoAlmacenFrm.editionMode ? 'Guardar cambios' : 'Crear'}"
                                         icon="pi pi-check"
                                         actionListener="#{tipoAlmacenFrm.btnGuardarHandler}"
                                         process=":frmPrincipal:dlg"
                                         update=":frmPrincipal"
                                         oncomplete="if (!args.validationFailed) PF('dlgVar').hide(); var btn = document.getElementById('frmPrincipal:btnVOLVER'); if(btn) btn.click();"/>
                    </div>
                </h:panelGrid>
            </p:dialog>

            <!-- Confirmación elegante de borrado -->
            <p:confirmDialog widgetVar="confirmDel" header="Confirmar eliminación" message="¿Eliminar este registro?"
                             icon="pi pi-exclamation-triangle" closable="false"
                             styleClass="ui-dialog">
                <div class="flex justify-end gap-2">
                    <p:commandButton value="Cancelar" type="button" styleClass="p-button-text"
                                     onclick="PF('confirmDel').hide()"/>
                    <p:commandButton value="Sí, eliminar" icon="pi pi-trash"
                                     actionListener="#{tipoAlmacenFrm.btnEliminarHandler(tipoAlmacenFrm.registro)}"
                                     update="frmPrincipal"
                                     oncomplete="PF('confirmDel').hide();"/>
                </div>
            </p:confirmDialog>

        </h:form>
    </ui:define>
</ui:composition>
</html>
