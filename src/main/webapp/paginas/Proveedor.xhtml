<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="template.xhtml">

   <ui:define name="content">
      <h:form id="frmPrincipal" update=":frmPrincipal:toolbar">

         <p:growl id="growl" showDetail="true" life="3000" />

         <!-- Toolbar superior -->
         <p:toolbar id="toolbar" class="toolbar-gap">
            <p:toolbarGroup class="toolbar-center">
               <span class="toolbar-title">#{proveedorFrm.nombreBean}</span>
            </p:toolbarGroup>

            <p:toolbarGroup class="toolbar-group-right">
               <p:inputText placeholder="Buscar por nombre…" value="#{proveedorFrm.registro.nombre}" />
               <ui:include src="componentes/botones-top.xhtml">
                  <ui:param name="section" value="nuevo"/>
                  <ui:param name="bean" value="#{proveedorFrm}"/>
               </ui:include>
               <ui:include src="componentes/botones-top.xhtml">
                  <ui:param name="section" value="volver"/>
                  <ui:param name="bean" value="#{proveedorFrm}"/>
               </ui:include>
            </p:toolbarGroup>
            <p:toolbarGroup>

               <!-- Botón Modificar -->
               <ui:include src="componentes/botones-top.xhtml">
                  <ui:param name="section" value="modificar"/>
                  <ui:param name="bean" value="#{proveedorFrm}"/>
               </ui:include>

               <ui:include src="componentes/botones-top.xhtml">
                  <ui:param name="section" value="eliminar"/>
                  <ui:param name="bean" value="#{proveedorFrm}"/>
               </ui:include>
            </p:toolbarGroup>
         </p:toolbar>

         <!-- Tabla de Proveedores -->
         <p:dataTable id="tbl"
                      value="#{proveedorFrm.model}" var="r"
                      lazy="true" paginator="true" rows="10"
                      rowsPerPageTemplate="10,20,50"
                      currentPageReportTemplate="Mostrando {startRecord}-{endRecord} de {totalRecords}"
                      paginatorPosition="bottom"
                      responsiveLayout="scroll"
                      rowHover="true"
                      rendered="#{!proveedorFrm.pnlDetalle}"
                      emptyMessage="No hay registros"
                      styleClass="table-modern"
                      selectionMode="single"
                      selection="#{proveedorFrm.registro}" rowKey="#{r.id}" >

            <p:ajax event="rowSelect"
                    listener="#{proveedorFrm.selectionHandler}"
                    update="frmPrincipal"/>

            <p:ajax event="rowUnselect"
                    listener="#{proveedorFrm.rowUnselectHandler}"
                    update=":frmPrincipal:tbl :frmPrincipal:growl :frmPrincipal:toolbar"  />

            <p:column headerText="ID" style="width:90px" sortBy="#{r.id}">
               <h:outputText value="#{r.id}" />
            </p:column>

            <p:column headerText="Nombre" sortBy="#{r.nombre}" filterBy="#{r.nombre}" filterMatchMode="contains">
               <h:outputText value="#{r.nombre}" />
            </p:column>

            <p:column headerText="Razón Social" sortBy="#{r.razonSocial}" filterBy="#{r.razonSocial}" filterMatchMode="contains">
               <h:outputText value="#{r.razonSocial}" />
            </p:column>

            <p:column headerText="NIT" sortBy="#{r.nit}" filterBy="#{r.nit}" filterMatchMode="contains">
               <h:outputText value="#{r.nit}" />
            </p:column>

            <p:column headerText="Estado" style="width:100px">
               <h:outputText value="#{r.activo ? 'Activo' : 'Inactivo'}" />
            </p:column>
         </p:dataTable>

         <!-- Panel de Detalle -->
         <h:panelGroup id="pnlDetalle" class="detalle-panel" rendered="#{proveedorFrm.pnlDetalle}">
            <!-- Título del panel -->
            <h:outputText value="Detalle del Proveedor" class="detalle-titulo"/>

            <h:panelGrid columns="2" class="form-item">
               <p><strong>ID:</strong> #{proveedorFrm.registro.id}</p>
               <p><strong>Nombre:</strong> #{proveedorFrm.registro.nombre}</p>
            </h:panelGrid>

            <h:panelGrid columns="2" class="form-item">
               <p><strong>Razón Social:</strong> #{proveedorFrm.registro.razonSocial}</p>
               <p><strong>NIT:</strong> #{proveedorFrm.registro.nit}</p>
            </h:panelGrid>

            <h:panelGrid columns="2" class="form-item">
               <p><strong>Observaciones:</strong></p>
               <p:inputTextarea value="#{proveedorFrm.registro.observaciones}" rows="3" cols="30" disabled="true" />
            </h:panelGrid>

            <p><strong>Estado:</strong> #{proveedorFrm.registro.activo ? 'Activo' : 'Inactivo'}</p>
         </h:panelGroup>

         <!-- Diálogo Crear/Editar -->
         <p:dialog id="dlg" header="#{proveedorFrm.editionMode ? 'Editar' : 'Nuevo'} Proveedor"
                   widgetVar="dlgVar" modal="true" resizable="true" closable="true" width="520"
                   visible="#{proveedorFrm.mostrarFormulario}"
                   styleClass="ui-dialog">

            <h:panelGrid columns="1" columnClasses="w-full" styleClass="gap-2 w-full">
               <p:messages />

               <p:inputText value="#{proveedorFrm.registro.nombre}" placeholder="Nombre" required="true"
                            requiredMessage="El nombre es obligatorio"/>

               <p:inputText value="#{proveedorFrm.registro.razonSocial}" placeholder="Razón Social"/>

               <p:inputText value="#{proveedorFrm.registro.nit}" placeholder="NIT" maxlength="14"/>

               <p:inputTextarea value="#{proveedorFrm.registro.observaciones}" rows="3" autoResize="true"
                                placeholder="Observaciones (opcional)"/>

               <h:panelGrid columns="2" styleClass="align-items-center">
                  <h:selectBooleanCheckbox id="chkActivo" value="#{proveedorFrm.registro.activo}"/>
                  <h:outputLabel for="chkActivo" value="¿Activo?" />
               </h:panelGrid>

               <div class="flex justify-end gap-2 mt-3">
                  <ui:include src="componentes/botones-top.xhtml">
                     <ui:param name="section" value="cancelar"/>
                     <ui:param name="bean" value="#{proveedorFrm}"/>
                  </ui:include>
                  <ui:include src="componentes/botones-top.xhtml">
                     <ui:param name="section" value="guardar"/>
                     <ui:param name="bean" value="#{proveedorFrm}"/>
                  </ui:include>
               </div>
            </h:panelGrid>
         </p:dialog>

         <!-- Confirmación elegante de borrado -->
         <p:confirmDialog widgetVar="confirmDel" header="Confirmar eliminación" message="¿Eliminar este registro?"
                          icon="pi pi-exclamation-triangle" closable="false"
                          styleClass="ui-dialog">
            <div class="flex justify-end gap-2">
               <ui:include src="componentes/botones-top.xhtml">
                  <ui:param name="section" value="cancelarBorrado"/>
                  <ui:param name="bean" value="#{proveedorFrm}"/>
               </ui:include>
               <ui:include src="componentes/botones-top.xhtml">
                  <ui:param name="section" value="eliminarDefinitivo"/>
                  <ui:param name="bean" value="#{proveedorFrm}"/>
               </ui:include>
            </div>
         </p:confirmDialog>

      </h:form>
   </ui:define>
</ui:composition>
</html>
